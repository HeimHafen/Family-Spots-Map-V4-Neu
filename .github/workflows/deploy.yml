# GitHub Pages: ein kontrollierter Veröffentlichungsablauf.
# Repository Settings > Pages > Source muss auf "GitHub Actions" stehen.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eine laufende Veröffentlichung wird abgeschlossen.
# Weitere Änderungen warten; überholte wartende Läufe werden ersetzt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Every commit gets one self-consistent release, generated in CI.
      # Manual Working Copy edits no longer need checksum/version bookkeeping.
      - name: Prepare release and refresh all integrity hashes
        shell: bash
        run: |
          RELEASE="$(date -u +%Y%m%d)-commit-${GITHUB_SHA:0:12}"
          node tools/prepare-release.mjs "$RELEASE"

      - name: Validate application before publishing
        run: node tools/check-project.mjs

      - name: Check update-system invariants
        run: node tools/check-update-system.mjs

      - name: Simulate offline update failures
        run: node tools/test-update-worker.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage Public App
        run: |
          mkdir -p _site
          cp -R assets css da data en experimente js src utils vendor _site/
          cp .nojekyll Lizenz index.html init.js manifest.webmanifest offline.html robots.txt service-worker.js sitemap.xml _site/

      - name: Write uncached published-version receipt
        run: node tools/write-release-info.mjs

      - name: Upload Static Files
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
