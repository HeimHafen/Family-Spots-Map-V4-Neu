# GitHub Pages is currently published from main / (root) in repository settings.
# This optional manual preflight does not perform a second Pages deployment.
name: Manual release preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate project integrity
        run: node tools/check-project.mjs
